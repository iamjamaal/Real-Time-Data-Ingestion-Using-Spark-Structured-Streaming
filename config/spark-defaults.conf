# Application Properties
spark.app.name=EcommerceStreamProcessor
spark.master=spark://spark-master:7077

# Memory Configuration
spark.executor.memory=2g
spark.driver.memory=1g
spark.executor.cores=2
spark.driver.cores=1

# Streaming Configuration
spark.streaming.stopGracefullyOnShutdown=true
spark.sql.streaming.checkpointLocation=/data/checkpoints
spark.sql.streaming.schemaInference=false

# Shuffle and Partition Settings
spark.sql.shuffle.partitions=4
spark.default.parallelism=4

# PostgreSQL JDBC
spark.jars=/opt/spark/jars/postgresql-42.6.0.jar

# Logging
spark.eventLog.enabled=true
spark.eventLog.dir=/data/logs/spark-events

# Performance Tuning
spark.sql.adaptive.enabled=true
spark.sql.adaptive.coalescePartitions.enabled=true